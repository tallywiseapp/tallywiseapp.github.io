<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Tallywise</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column; sticky top bar with the two entry buttons, hash-routed views below. */
:root{
  --bg:#fbf6f0; --surface:#ffffff; --sunk:#f3e9df; --line:#ead9c8;
  --ink:#2f1e16; --ink-2:#6b5244; --ink-3:#8c7262;
  --accent:#c4512b; --accent-ink:#ffffff; --accent-soft:#fbe3d4;
  --in:#2a78d6; --out:#eb6834;
  --good:#0a7a3e; --warn:#a86400; --bad:#c0362c;
  --good-soft:#dcf1e4; --warn-soft:#fbecd2; --bad-soft:#f9dedb;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a120d; --surface:#241912; --sunk:#2e2118; --line:#3f2e22;
  --ink:#f8ece2; --ink-2:#d2bba9; --ink-3:#a68d7a;
  --accent:#f29b62; --accent-ink:#2a1206; --accent-soft:#3e2416;
  --in:#3987e5; --out:#d95926;
  --good:#4cc77f; --warn:#e7a43c; --bad:#f07466;
  --good-soft:#14301f; --warn-soft:#352812; --bad-soft:#3a1a17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1a120d; --surface:#241912; --sunk:#2e2118; --line:#3f2e22;
  --ink:#f8ece2; --ink-2:#d2bba9; --ink-3:#a68d7a;
  --accent:#f29b62; --accent-ink:#2a1206; --accent-soft:#3e2416;
  --in:#3987e5; --out:#d95926;
  --good:#4cc77f; --warn:#e7a43c; --bad:#f07466;
  --good-soft:#14301f; --warn-soft:#352812; --bad-soft:#3a1a17;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-right:auto}
.brand h1{font-size:1.35rem}.brand .logo{width:30px;height:30px;flex:none;margin-right:-2px}
.brand .tag{font-size:.78rem;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.in{border-color:var(--in);color:var(--in)}
.btn.out{border-color:var(--out);color:var(--out)}
.btn.in:hover,.btn.out:hover{background:var(--sunk)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.addrow{display:flex;justify-content:flex-start}
.btip{position:fixed;z-index:60;max-width:240px;background:#1d2a2a;color:#fff;font-size:.8rem;line-height:1.35;padding:7px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none}
.btip[hidden]{display:none}
button,a.btn,nav.tabs a{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.headsup .list{max-height:420px;overflow:auto}
.headsbtn .hcount{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:.75rem;display:inline-grid;place-items:center}.headsbtn.od .hcount{background:var(--bad)}
.neg,.kpi .neg{color:var(--bad)}
.dashcols{columns:1;column-gap:18px}
.dashcols>*{break-inside:avoid;margin:0 0 18px;width:100%;display:flex}
@media (min-width:760px){.dashcols{columns:2}}
@media (min-width:1180px){.dashcols{columns:3}}
.dashcols .tx .ic{grid-row:span 2}.dashcols .tx .main{grid-row:span 2;min-width:0}.dashcols .tx .acts{grid-column:3;justify-self:end}
.dashcols #perfPanel .t{font-size:.8rem}.dashcols #perfPanel .t th,.dashcols #perfPanel .t td{padding-left:4px;padding-right:4px}
.wl{display:flex;flex-direction:column;gap:12px}
.wi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.wi.hit{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.wi .sym{font-weight:700;font-size:1.05rem}.wi .nm{color:var(--ink-2);font-size:.88rem}
.wi .px{text-align:right;font-family:var(--f-num);font-weight:700;font-size:1.05rem}
.wi .chg{text-align:right;font-size:.85rem;font-weight:600}.chg.up{color:var(--good)}.chg.down{color:var(--bad)}
.wi .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-2)}
.wi .own{grid-column:1 / -1;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.85rem}
.wi .note{grid-column:1 / -1;font-size:.85rem;color:var(--ink-2);white-space:pre-wrap}
.wi .acts{grid-column:1 / -1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.discard{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,#000 35%,transparent)}
.discard .box{background:var(--surface);border-radius:14px;padding:18px;width:min(340px,100%);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.discard h3{margin:0 0 6px;font-size:1.05rem}.discard p{margin:0 0 14px;color:var(--ink-2)}
.discard .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.sync{border:0}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 12px;text-decoration:none;color:var(--ink-2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbar{border-top:1px solid var(--line)}
.tabbar .wrap{padding-block:0}

main .wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner p{margin:0;flex:1 1 260px;min-width:0}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1}
select.inline{max-width:100%;min-width:0;text-overflow:ellipsis;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpis .hero{grid-column:1 / -1}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.kpis{grid-template-columns:minmax(0,1fr)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .label{color:inherit;opacity:.8}
.kpi .val{font-family:var(--f-num);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--ink-2)}
.kpi.hero .sub{color:inherit;opacity:.85}
.kpi .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:baseline}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.catgrp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:10px 4px 4px;border-bottom:1px solid var(--line)}.catgrp:not(:first-child){margin-top:8px}
[dir=rtl] .num,[dir=rtl] .a1,[dir=rtl] .px,[dir=rtl] .chg{direction:ltr;unicode-bidi:isolate}[dir=rtl] .kpi .val,[dir=rtl] .amt{text-align:right}
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.langgrid .btn{justify-content:center;padding:12px}
.panel header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel[data-fold] header{align-items:center}.panel[data-fold] header .foldbtn{margin-left:auto}.panel.folded>:not(header){display:none}.panel.folded header{margin-bottom:0}

/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 9px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tip b{font-weight:600}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.bar-row .track{height:12px;background:var(--sunk);border-radius:0 4px 4px 0;overflow:hidden}
.bar-row .fill{height:100%;background:var(--out);border-radius:0 4px 4px 0}
.bar-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* lists */
.list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--f-num)}
.tx .ic.in{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.tx .ic.out{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.tx .main{min-width:0}
.tx .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:.8rem;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{text-align:right;min-width:0}.tx .amt .chip{white-space:normal;max-width:100%}
.tx .amt .a1{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tx .amt .a2{font-size:.78rem;color:var(--ink-3);font-family:var(--f-num)}
.tx .acts{grid-column:2 / -1;display:flex;gap:6px;justify-content:flex-end}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}

.goal{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal.withart{flex-direction:row;align-items:center;gap:12px}.goal .gbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.gart{flex:none}
.goal .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.prog > div{height:100%;background:var(--accent);border-radius:5px}
.prog.done > div{background:var(--good)}

table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border-top:0}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}

/* sheet (entry form) */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(640px,100%);display:flex;flex-direction:column}
.sheet > header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px}
.sheet .body{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.sheet footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sheet footer .err{margin-right:auto;color:var(--bad);font-size:.85rem;flex:1 1 200px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.kind button[aria-pressed="true"][data-v="in"]{background:var(--in);border-color:var(--in);color:#fff}
.seg.kind button[aria-pressed="true"][data-v="out"]{background:var(--out);border-color:var(--out);color:#fff}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1 / -1}
@media (max-width:520px){.fields{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%;min-width:0}
.f textarea{min-height:60px;resize:vertical}
.f .hint{font-size:.76rem;color:var(--ink-3)}
.calc{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}
.calc b{font-family:var(--f-num);font-weight:500}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-weight:600;font-size:.85rem;padding:0 6px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.items-in{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 64px 100px auto;gap:6px;align-items:center}
.items td input[type="checkbox"]{width:18px;height:18px}
.items tr.off td{color:var(--ink-3);text-decoration:line-through}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;flex:none}
.thumb{max-height:120px;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.heroRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.heroRow > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.tx .ic.open{background:var(--sunk);color:var(--ink-2)}
.wzprog{height:4px;background:var(--sunk)}
.wzprog > div{height:100%;background:var(--accent)}
.wzrows{display:flex;flex-direction:column}
.wzrow{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.wzrow:first-child{border-top:0;padding-top:0}
.wzrow .fields{width:100%}
.wzfeat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.wzfeat li{display:flex;gap:10px;align-items:flex-start}.wzfeat .ic{font-size:20px;line-height:1.2;flex:none}.wzfeat b,.wzfeat .muted{display:block}.wzfeat .muted{font-size:.92em}
.wzsum{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
.lockov{background:var(--bg);z-index:40;align-items:center}

/* tab heroes: each tab gets its own hue and illustration */
body{--tab:#c4512b;--tab2:#e8874a}
body[data-tab="transactions"]{--tab:#3346b8;--tab2:#5b6fe0}
body[data-tab="loans"]{--tab:#a8521a;--tab2:#d27a2c}
body[data-tab="goals"]{--tab:#2d7a34;--tab2:#4fa356}
body[data-tab="wealth"]{--tab:#9a2f6e;--tab2:#c95592}
body[data-tab="recurring"]{--tab:#6a3c9e;--tab2:#9061c9}
body[data-tab="setup"]{--tab:#3a5663;--tab2:#5b7d8c}
nav.tabs a[aria-current="page"]{border-bottom-color:var(--tab)}
.tabhero{position:relative;overflow:hidden;border-radius:14px;padding:18px 18px 18px 20px;color:#fff;background:linear-gradient(135deg,var(--tab),var(--tab2));display:flex;align-items:center;gap:12px;min-height:118px}
.tabhero::before,.tabhero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.tabhero::before{width:220px;height:220px;right:-60px;top:-90px}
.tabhero::after{width:120px;height:120px;left:-40px;bottom:-70px}
.tabhero .tx-t{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tabhero h2{font-size:1.4rem;color:#fff}
.tabhero p{margin:0;font-size:.88rem;opacity:.9;max-width:46ch}
.tabhero svg{position:relative;flex:none;width:118px;height:94px}
@media (max-width:420px){.tabhero svg{width:92px;height:74px}.tabhero h2{font-size:1.2rem}}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabhero{filter:brightness(.88)} }
:root[data-theme="dark"] .tabhero{filter:brightness(.88)}
@media (prefers-reduced-motion:no-preference){.prog > div{transition:width .4s ease}}


/* lighter tab headers */
.tabhero{background:linear-gradient(135deg,color-mix(in srgb,var(--tab) 28%,var(--surface)),color-mix(in srgb,var(--tab2) 14%,var(--surface)));color:color-mix(in srgb,var(--tab) 65%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tab) 20%,transparent);filter:none!important}

.tabhero::before,.tabhero::after{background:color-mix(in srgb,var(--surface) 22%,transparent)}
.tabhero p{opacity:1}
.tabhero svg [fill="#fff"]{stroke:color-mix(in srgb,var(--tab) 45%,transparent);stroke-width:1.5}

header.top{background:color-mix(in srgb,var(--tab) 4.5%,var(--surface))}
.brand h1{background:linear-gradient(90deg,#c4512b,#e0643d 45%,#f0a040);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.tabs{gap:6px;padding:6px 0}
nav.tabs a{border-radius:999px;border-bottom:0;padding:7px 14px}

.btn.primary{background:linear-gradient(135deg,var(--tab),color-mix(in srgb,var(--tab2) 75%,#fff));border-color:transparent}

#addIn:hover,#addOut:hover{filter:brightness(1.08);background-color:inherit}
.panel{--pc:var(--c1);border:0;border-top:3px solid color-mix(in srgb,var(--pc) 60%,var(--surface));background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 3.5%,var(--surface)),var(--surface) 140px);box-shadow:0 2px 10px rgba(20,33,31,.07)}
.panel:nth-of-type(6n+2){--pc:var(--c2)} .panel:nth-of-type(6n+3){--pc:var(--c3)} .panel:nth-of-type(6n+4){--pc:var(--c4)} .panel:nth-of-type(6n+5){--pc:var(--c5)} .panel:nth-of-type(6n){--pc:var(--c6)}

.kpi{--pc:var(--c1);border:0;border-left:4px solid color-mix(in srgb,var(--pc) 60%,var(--surface));background:color-mix(in srgb,var(--pc) 5%,var(--surface));box-shadow:0 2px 8px rgba(20,33,31,.06)}
.kpi:nth-child(3){--pc:var(--c2)} .kpi:nth-child(4){--pc:var(--c4)} .kpi:nth-child(5){--pc:var(--c3)} .kpi:nth-child(6){--pc:var(--c6)} .kpi:nth-child(7){--pc:var(--c5)}
.kpi.hero{border-left:0;background:linear-gradient(135deg,color-mix(in srgb,var(--tab) 22%,var(--surface)),color-mix(in srgb,var(--tab2) 12%,var(--surface)));color:var(--ink);box-shadow:0 2px 10px color-mix(in srgb,var(--tab) 15%,transparent)}
.tx .ic{border-radius:50%;width:34px;height:34px}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .panel,:root:not([data-theme="light"]) .kpi{box-shadow:none} }
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .kpi{box-shadow:none}

/* tab menu: a button opens the tabs as a vertical side panel */
.menubtn{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--tab) 35%,var(--line));background:color-mix(in srgb,var(--tab) 10%,var(--surface));color:color-mix(in srgb,var(--tab) 75%,var(--ink));border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.menubtn:hover{background:color-mix(in srgb,var(--tab) 16%,var(--surface))}
.tabbar{position:fixed;top:0;left:0;bottom:0;width:min(290px,84vw);z-index:60;background:var(--surface);border:0;border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);visibility:hidden;overflow-y:auto}
body.menu-open .tabbar{transform:none;visibility:visible}
@media (prefers-reduced-motion:no-preference){.tabbar{transition:transform .22s ease,visibility .22s}}
.tabbar .wrap{padding:16px 14px;display:flex;flex-direction:column;align-items:stretch;gap:10px;max-width:none;width:auto;margin:0}
.menuhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:1.1rem;padding:0 4px}

nav.tabs a{display:block;padding:13px 16px;border-radius:12px;font-size:1.05rem;font-weight:600;color:var(--ink-2);transition:background-color .15s,color .15s}
nav.tabs a[data-v="dashboard"]{--dot:#c4512b;--dot2:#e8874a} nav.tabs a[data-v="transactions"]{--dot:#3346b8;--dot2:#5b6fe0} nav.tabs a[data-v="loans"]{--dot:#a8521a;--dot2:#d27a2c} nav.tabs a[data-v="goals"]{--dot:#2d7a34;--dot2:#4fa356} nav.tabs a[data-v="wealth"]{--dot:#9a2f6e;--dot2:#c95592} nav.tabs a[data-v="recurring"]{--dot:#6a3c9e;--dot2:#9061c9} nav.tabs a[data-v="setup"]{--dot:#3a5663;--dot2:#5b7d8c}
nav.tabs a:hover{color:var(--dot);background:color-mix(in srgb,var(--dot) 8%,transparent)}
nav.tabs a[aria-current="page"]{background:linear-gradient(135deg,color-mix(in srgb,var(--dot) 22%,var(--surface)),color-mix(in srgb,var(--dot2) 10%,var(--surface)));color:color-mix(in srgb,var(--dot) 85%,var(--ink));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dot) 30%,transparent)}
.tabbar{background:linear-gradient(180deg,color-mix(in srgb,var(--tab) 7%,var(--surface)),var(--surface) 260px)}
.menuhead b{color:color-mix(in srgb,var(--tab) 75%,var(--ink))}
.tabbar .wrap{min-height:100%;box-sizing:border-box}.menufoot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:.8rem}.menufoot a{color:var(--ink-3);text-decoration:none}.menufoot a:hover{color:var(--ink-2);text-decoration:underline}.mfmail{display:flex;align-items:center;gap:6px;margin-top:-4px;padding-left:1.2em}.mfaddr{color:var(--ink-3);font-size:.72rem;word-break:break-all;user-select:all;-webkit-user-select:all}.mfcopy{flex:none;font:inherit;font-size:.72rem;color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;cursor:pointer}.mfcopy:hover{border-color:var(--ink-3)}
#menuShade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}

/* add button: one round + that pops up Inflow and Outflow */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fabbtn{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--tab),color-mix(in srgb,var(--tab2) 80%,#fff));box-shadow:0 6px 18px color-mix(in srgb,var(--tab) 40%,transparent);display:grid;place-items:center}
.fabbtn svg{transition:transform .18s ease}
.draftfab{position:fixed;right:calc(max(16px,env(safe-area-inset-right)) + 70px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 5px);z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:10px}

.draftpop{width:min(380px,calc(100vw - 32px));max-height:min(60vh,460px);overflow:auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);margin-right:-70px}

.draftpop .panel{margin:0}
.fab.open .fabbtn svg{transform:rotate(45deg)}
.fabmenu{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fabmenu[hidden]{display:none}
.fabmenu .btn{min-width:130px;justify-content:flex-start;font-size:1rem;padding:10px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.14)}

مستحق {#}-{#}-{#} · متأخر {#} يومًا","Check & record":"تحقق وسجّل","Skip this one":"تخطي هذه المرة","Switch to auto":"التبديل إلى تلقائي","Pause":"إيقاف مؤقت","Bills & Subscriptions":"فواتير واشتراكات","Every month":"كل شهر","Reminder":"تذكير","next {#}-{#}-{#}":"التالي {#}-{#}-{#}","Auto":"تلقائي","records the entry on its due date at that day's rate.":"يسجّل القيد في تاريخ استحقاقه بسعر ذلك اليوم.","asks you to check the amount first, which suits bills that change.":"يطلب منك التحقق من المبلغ أولًا، وهو مناسب للفواتير المتغيرة.","Your profile, currencies, accounts, cards and backups.":"ملفك الشخصي والعملات والحسابات والبطاقات والنسخ الاحتياطية.","Profile":"الملف الشخصي","Run setup again":"تشغيل الإعداد مجددًا","Google picks this account when you connect Drive.":"يختار Google هذا الحساب عند ربط Drive.","No PIN lock. A PIN locks the app on this screen (a privacy lock, not encryption).":"لا يوجد قفل PIN. يقفل PIN التطبيق على هذه الشاشة (قفل خصوصية، وليس تشفيرًا).","Set PIN":"تعيين PIN","Run setup again to add starting balances, cards, people, bills, savings or investments. It adds to what you already have.":"شغّل الإعداد مجددًا لإضافة أرصدة افتتاحية أو بطاقات أو أشخاص أو فواتير أو مدخرات أو استثمارات. يضيف إلى ما لديك بالفعل.","Exchange rates":"أسعار الصرف","Each rate is the official rate of the central bank of the currency you pick below (for example BSP for PHP, SAMA for SAR), updated daily. When that bank doesn't publish a rate for a currency, the market rate is used and labelled “Market rate”. You can type over any rate. Entries always keep their own currency, and each one keeps the rate from the day you saved it.":"كل سعر هو السعر الرسمي للبنك المركزي للعملة التي تختارها أدناه (مثل BSP للبيزو، وساما للريال)، ويُحدَّث يوميًا. عندما لا ينشر ذلك البنك سعرًا لعملة ما، يُستخدم سعر السوق ويُوسم بـ «سعر السوق». يمكنك الكتابة فوق أي سعر. تحتفظ القيود دائمًا بعملتها، ويحتفظ كل قيد بسعر يوم حفظه.","Show what each currency is worth in":"اعرض قيمة كل عملة بـ","Source":"المصدر","Last set":"آخر تعيين","Market rate":"سعر السوق","Not set":"غير محدد","Same currency":"العملة نفسها","Add currency":"إضافة عملة","Accounts & cards":"الحسابات والبطاقات","Everywhere money goes in and out. Pick one on every entry.":"كل مكان يدخل منه المال ويخرج. اختر واحدًا في كل قيد.","Credit:":"ائتمان:","pay the bill with":"سدّد الفاتورة عبر","Outflow → Credit Card Payment":"صادر ← سداد بطاقة ائتمان","; unpaid balances count in Debt to pay.":"؛ تُحسب الأرصدة غير المسددة في ديون للسداد.","Debit:":"خصم:","spending comes out of its linked bank account.":"يُخصم الإنفاق من الحساب البنكي المرتبط.","Prepaid:":"مسبقة الدفع:","load it with":"اشحنها عبر","Outflow → Card Top-up":"صادر ← شحن بطاقة","; spending lowers its balance.":"؛ يخفض الإنفاق رصيدها.","balance":"الرصيد","started with {#} on {#}-{#}-{#}":"بدأ بـ {#} في {#}-{#}-{#}","Credit":"ائتمان","Debit":"خصم","Prepaid":"مسبقة الدفع","+ Add an account or card":"+ إضافة حساب أو بطاقة","Keep your ledger in your own Google Drive so it's the same on your phone and laptop. The page only sees the files it creates. First add a Google client ID:":"احفظ دفترك في Google Drive الخاص بك ليكون نفسه على هاتفك وحاسوبك. لا ترى الصفحة إلا الملفات التي تنشئها. أضف أولًا معرّف عميل Google:","Save client ID":"حفظ معرّف العميل","How to get a Google client ID (one time, about {#} minutes, free)":"كيف تحصل على معرّف عميل Google (مرة واحدة، حوالي {#} دقائق، مجانًا)","and create a project named \"Tallywise\".":"وأنشئ مشروعًا باسم \"Tallywise\".","Go to APIs & Services → Library, search \"Google Drive API\" and click Enable.":"انتقل إلى APIs & Services ← Library، وابحث عن \"Google Drive API\" واضغط Enable.","Go to APIs & Services → OAuth consent screen. Choose External, fill in the app name and your email, add the scope":"انتقل إلى APIs & Services ← OAuth consent screen. اختر External، واملأ اسم التطبيق وبريدك، وأضف النطاق",", and add your Gmail as a test user.":"، وأضف بريد Gmail الخاص بك كمستخدم تجريبي.","Go to APIs & Services → Credentials → Create credentials → OAuth client ID. Type: Web application. Under Authorized JavaScript origins add":"انتقل إلى APIs & Services ← Credentials ← Create credentials ← OAuth client ID. النوع: Web application. ضمن Authorized JavaScript origins أضف","Copy the client ID and paste it above.":"انسخ معرّف العميل والصقه أعلاه.","Backup":"النسخ الاحتياطي","Save a copy of everything as a file, or restore from one. Use it before switching phones, or to move your data between the claude.ai page and the standalone website.":"احفظ نسخة من كل شيء كملف، أو استعد من نسخة. استخدمه قبل تغيير الهاتف، أو لنقل بياناتك بين صفحة claude.ai والموقع المستقل.","Download backup":"تنزيل نسخة احتياطية","Restore from backup":"الاستعادة من نسخة احتياطية","Sounds":"الأصوات","Play sounds when I save an entry or reach a goal":"تشغيل الأصوات عند حفظ قيد أو بلوغ هدف","Example entries":"قيود تجريبية","Fill Tallywise with sample entries that use every feature: two currencies, goals, a credit card with a foreign purchase, loans with installments and interest, investments and repeating bills. Each one is marked “example”, and one tap removes them all without touching your own entries.":"املأ Tallywise بقيود تجريبية تستخدم كل الميزات: عملتان، أهداف، بطاقة ائتمان بمشتريات أجنبية، قروض بأقساط وفائدة، استثمارات وفواتير متكررة. كل منها موسوم بـ «example»، ونقرة واحدة تزيلها كلها دون المساس بقيودك.","Remove example entries":"إزالة القيود التجريبية","Install on your phone":"التثبيت على هاتفك","Add Tallywise to your home screen so it opens like an app.":"أضف Tallywise إلى الشاشة الرئيسية ليفتح كتطبيق.","How to install":"طريقة التثبيت","Receipt reading":"قراءة الإيصالات","Receipts are scanned for free on this device. It works best on clear English receipts; always check the items. For better accuracy on non-English and crumpled receipts, add your own":"تُمسح الإيصالات مجانًا على هذا الجهاز. تعمل بأفضل شكل على الإيصالات الإنجليزية الواضحة؛ تحقق دائمًا من البنود. لدقة أفضل مع الإيصالات غير الإنجليزية أو المجعدة، أضف","Anthropic API key":"مفتاح Anthropic API الخاص بك",". It is kept only in this browser and is never saved to Google Drive.":". يُحفظ في هذا المتصفح فقط ولا يُحفظ أبدًا في Google Drive.","Save key":"حفظ المفتاح","PIN, {#} to {#} digits":"PIN، من {#} إلى {#} أرقام","Add a currency":"إضافة عملة","Google OAuth client ID (ends in .apps.googleusercontent.com)":"معرّف عميل Google OAuth (ينتهي بـ .apps.googleusercontent.com)","Add an account or card":"إضافة حساب أو بطاقة","Credit card":"بطاقة ائتمان","Debit card":"بطاقة خصم","Prepaid card":"بطاقة مسبقة الدفع","Linked bank account":"الحساب البنكي المرتبط","Spending with this card comes out of this account":"يُخصم الإنفاق بهذه البطاقة من هذا الحساب","Starting balance":"الرصيد الافتتاحي","Money in it on the date below. Leave empty if you don't know.":"المال فيه في التاريخ أدناه. اتركه فارغًا إن لم تكن تعرف.","Current balance on the card":"الرصيد الحالي على البطاقة","Credit limit":"الحد الائتماني","Payment due day of month":"يوم استحقاق الدفع من الشهر","Current balance owed":"الرصيد المستحق حاليًا","From your latest statement or banking app":"من آخر كشف حساب أو تطبيق البنك","Balance as of":"الرصيد في تاريخ","Card entries from this date on are added to it":"تُضاف إليه قيود البطاقة من هذا التاريخ فصاعدًا","Current payment plan":"خطة السداد الحالية","No plan set":"لا توجد خطة","Pay in full every month":"السداد الكامل كل شهر","Installment plan":"خطة تقسيط","Minimum payment":"الحد الأدنى للدفع","Monthly payment":"الدفعة الشهرية","Months left":"الأشهر المتبقية","Minimum payment %":"الحد الأدنى للدفع %","Minimum payment at least":"الحد الأدنى للدفع لا يقل عن","Interest / profit rate per year %":"نسبة الفائدة / الربح سنويًا %","Used to estimate the payoff date":"تُستخدم لتقدير تاريخ السداد الكامل","Remind me every month on the due day to record the card payment":"ذكّرني كل شهر في يوم الاستحقاق بتسجيل دفعة البطاقة","e.g. Main bank, Visa Platinum":"مثال: البنك الرئيسي، فيزا بلاتينيوم","{#} if none":"{#} إن لم يوجد","{#} overdue":"{#} متأخرة","{#} due within a week":"{#} مستحقة خلال أسبوع","{#} at target price":"{#} عند السعر المستهدف","Installment to collect":"قسط للتحصيل","recurring":"متكرر","Record it":"سجّله","Loan to collect":"قرض للتحصيل","hit your buy target":"بلغ هدف الشراء","Now {#} · buy target {#}":"الآن {#} · هدف الشراء {#}","buy target {#}":"هدف الشراء {#}","hit your sell target":"بلغ هدف البيع","Now {#} · sell target {#}":"الآن {#} · هدف البيع {#}","sell target {#}":"هدف البيع {#}","Flags start {#} days before a due date and stay until it's paid or recorded.":"تبدأ التنبيهات قبل {#} أيام من تاريخ الاستحقاق وتبقى حتى السداد أو التسجيل.","Hide heads up":"إخفاء التنبيهات","Close add menu":"إغلاق قائمة الإضافة","New entry":"قيد جديد","is money coming in to you.":"هو مال يصل إليك.","is money going out from you.":"هو مال يخرج منك.","Your regular pay. Enter gross pay and deductions, and the net is worked out for you. It also sizes your Emergency Fund.":"راتبك المنتظم. أدخل إجمالي الراتب والاستقطاعات، ويُحسب الصافي تلقائيًا. يحدد أيضًا صندوق الطوارئ.","Extra pay on top of salary, like housing or food allowance, or overtime.":"أجر إضافي فوق الراتب، مثل بدل السكن أو الطعام، أو العمل الإضافي.","Earnings paid by stocks or funds you own. Enter the gross and any tax withheld.":"أرباح تدفعها الأسهم أو الصناديق التي تملكها. أدخل الإجمالي وأي ضريبة مقتطعة.","Someone paying you back for money you lent them. Pick the loan, and its balance goes down.":"شخص يعيد لك مالًا أقرضته إياه. اختر القرض، وسينخفض رصيده.","Money earned from a business or side job.":"مال مكتسب من عمل تجاري أو عمل جانبي.","Money you borrowed from someone. It shows under Debt to pay until you repay it.":"مال اقترضته من شخص ما. يظهر ضمن ديون للسداد حتى تسدده.","Money returned to you, like a store refund or an expense your company reimbursed.":"مال أُعيد إليك، مثل استرداد من متجر أو مصروف عوّضته شركتك.","Money you take out of your free savings or a goal. That balance goes down.":"مال تسحبه من مدخراتك الحرة أو من هدف. ينخفض ذلك الرصيد.","Selling stocks, funds, crypto, gold or forex. Pick the asset type, then enter the units, price and fees.":"بيع أسهم أو صناديق أو عملات مشفرة أو ذهب أو فوركس. اختر نوع الأصل، ثم أدخل الوحدات والسعر والرسوم.","Any other income, like a gift or prize. Say what it is.":"أي دخل آخر، مثل هدية أو جائزة. اذكر ما هو.","Pay period from":"فترة الراتب من","Pay period to":"فترة الراتب إلى","Gross pay":"إجمالي الراتب","Deductions":"الاستقطاعات","Taxes, social security, loans deducted from pay":"ضرائب، تأمينات اجتماعية، قروض مقتطعة من الراتب","Time":"الوقت","Account":"الحساب","Receipt / photo":"إيصال / صورة","Connect Google Drive to keep photos":"اربط Google Drive للاحتفاظ بالصور","Repeat":"تكرار","Doesn't repeat":"لا يتكرر","Every week":"كل أسبوع","Every {#} months":"كل {#} أشهر","Every year":"كل سنة","For subscriptions, rent, bills, salary and other regular entries":"للاشتراكات والإيجار والفواتير والراتب والقيود المنتظمة الأخرى","When it's due":"عند الاستحقاق","Remind me to check and record it":"ذكّرني بالتحقق وتسجيله","Record it automatically":"سجّله تلقائيًا","Pick \"remind me\" if the amount changes each time":"اختر «ذكّرني» إذا تغير المبلغ في كل مرة","Amount":"المبلغ","Net pay = gross − deductions":"صافي الراتب = الإجمالي − الاستقطاعات","Save entry":"حفظ القيد","Inflow or outflow":"وارد أو صادر","What do these types mean?":"ماذا تعني هذه الأنواع؟","Kind":"النوع","Allowance":"بدل","Overtime":"عمل إضافي","Paid by":"الدافع","Paid by (company or broker)":"الدافع (شركة أو وسيط)","Stock / ticker":"السهم / الرمز","Gross dividend":"إجمالي الأرباح","Tax withheld":"الضريبة المقتطعة","e.g. AAPL":"مثال: AAPL","Loan being repaid":"القرض الذي يُسدَّد","Choose the loan":"اختر القرض","Amount received":"المبلغ المستلم","Business / customer":"العمل / العميل","Business name":"اسم العمل","Amount borrowed":"المبلغ المقترض","Due date":"تاريخ الاستحقاق","Interest %":"الفائدة %","Flat interest on the whole loan, if any":"فائدة ثابتة على كامل القرض، إن وجدت","Refunded by":"أُعيد من","What it was for":"الغرض منه","Taken from":"مسحوب من","Free savings (not for a goal)":"مدخرات حرة (ليست لهدف)","Amount withdrawn":"المبلغ المسحوب","Asset type":"نوع الأصل","Symbol / ticker":"الرمز / المؤشر","Broker":"الوسيط","Shares / units sold":"الأسهم / الوحدات المباعة","Price per share / unit":"السعر لكل سهم / وحدة","Broker fees":"رسوم الوسيط","e.g. AAPL, BTC, XAU, EUR/USD":"مثال: AAPL، BTC، XAU، EUR/USD","Specify the income":"حدّد الدخل","e.g. Raffle prize, gift":"مثال: جائزة سحب، هدية","Add an amount above zero, the source, what the income is.":"أضف مبلغًا أكبر من صفر، والمصدر، وما هو الدخل.","Everyday spending like food, groceries, rent, transport or shopping. Scan a receipt or type the items.":"الإنفاق اليومي مثل الطعام والبقالة والإيجار والمواصلات والتسوق. امسح إيصالًا أو اكتب البنود.","Rent, utilities, phone, internet and subscriptions. You can set them to repeat.":"الإيجار والمرافق والهاتف والإنترنت والاشتراكات. يمكنك جعلها تتكرر.","Money sent to family or others, usually abroad. Enter the amount sent and the transfer fee.":"مال مُرسل إلى العائلة أو غيرها، عادةً إلى الخارج. أدخل المبلغ المرسل ورسوم التحويل.","Money you lend to someone. Set one-time or installments, interest and a late penalty. It shows under Debt to collect.":"مال تقرضه لشخص ما. حدّد دفعة واحدة أو أقساطًا، والفائدة وغرامة التأخير. يظهر ضمن ديون للتحصيل.","A payment toward money you borrowed. Pick the loan, and its balance goes down.":"دفعة لسداد مال اقترضته. اختر القرض، وسينخفض رصيده.","Paying your credit card bill. It moves money and isn't counted as new spending, since the purchases were already recorded.":"سداد فاتورة بطاقة الائتمان. ينقل المال ولا يُحسب إنفاقًا جديدًا، لأن المشتريات سُجّلت بالفعل.","Loading money onto a prepaid card. It moves money from the account you pick to the card, so it isn't counted as spending.":"تحميل المال على بطاقة مسبقة الدفع. ينقل المال من الحساب الذي تختاره إلى البطاقة، فلا يُحسب إنفاقًا.","Money put aside. Pick Free savings for money you can use for anything (shown on th ن المفيد معرفته","Every currency is kept separate. Totals are shown per currency and never converted.":"تُحفظ كل عملة بشكل منفصل. تُعرض المجاميع لكل عملة ولا تُحوّل أبدًا.","Your data is saved on this device. You can back it up anytime from Rates & accounts.":"تُحفظ بياناتك على هذا الجهاز. يمكنك نسخها احتياطيًا في أي وقت من الأسعار والحسابات.","You can lock the app with a PIN.":"يمكنك قفل التطبيق برمز PIN.","Next is a short setup of about {#} minutes. You can skip any step.":"التالي إعداد قصير يستغرق نحو {#} دقائق. يمكنك تخطي أي خطوة.","Proceed":"متابعة","This takes about {#} minutes. Skip any step you like, or skip it all and just start recording entries.":"يستغرق هذا نحو {#} دقائق. تخطَّ أي خطوة تريدها، أو تخطَّها كلها وابدأ بتسجيل القيود مباشرة.","Data privacy":"خصوصية البيانات","Your entries are stored only in this browser on this device. There is no Tallywise account or server, so no one else can see them.":"تُحفظ قيودك فقط في هذا المتصفح على هذا الجهاز. لا يوجد حساب أو خادم لـ Tallywise، لذلك لا يمكن لأحد غيرك رؤيتها.","If you connect Google Drive, a copy is saved in your own Drive. Tallywise can only open the file it created.":"إذا ربطت Google Drive، تُحفظ نسخة في Drive الخاص بك. لا يمكن لـ Tallywise فتح سوى الملف الذي أنشأه.","Receipt photos you scan are sent to Claude to read the items.":"تُرسل صور الإيصالات التي تمسحها إلى Claude لقراءة العناصر.","Receipt photos are read on this device. If you add your own Anthropic API key, they are sent to Anthropic to read instead.":"تُقرأ صور الإيصالات على هذا الجهاز. إذا أضفت مفتاح Anthropic API الخاص بك، تُرسل إلى Anthropic لقراءتها بدلًا من ذلك.","Exchange rates and prices are downloaded from public sources. Only currency codes and symbols are sent, never your amounts.":"تُنزَّل أسعار الصرف والأسعار من مصادر عامة. تُرسل رموز العملات والرموز فقط، ولا تُرسل مبالغك أبدًا.","Your PIN is never saved, only a scrambled version of it.":"لا يُحفظ رمز PIN أبدًا، بل نسخة مشفّرة منه فقط.","No ads and no tracking.":"لا إعلانات و nk doesn't publish a rate for a currency, the market rate is used and labelled “Market rate”. You can type over any rate. Entries always keep their own currency, and each one keeps the rate from the day you saved it.":"প্রতিটি হার আপনি নিচে যে মুদ্রা বেছে নেন তার কেন্দ্রীয় ব্যাংকের সরকারি হার (যেমন PHP-র জন্য BSP, SAR-এর জন্য SAMA), প্রতিদিন আপডেট হয়। সেই ব্যাংক কোনো মুদ্রার হার না দিলে বাজার হার ব্যবহার হয় এবং “বাজার হার” লেখা থাকে। যেকোনো হার আপনি বদলে লিখতে পারেন। এন্ট্রি সবসময় নিজের মুদ্রা রাখে, এবং যেদিন সংরক্ষণ করেছেন সেদিনের হার রাখে।","Show what each currency is worth in":"দেখান প্রতিটি মুদ্রার মূল্য কত","Source":"উৎস","Last set":"শেষ সেট","Market rate":"বাজার হার","Not set":"সেট হয়নি","Same currency":"একই মুদ্রা","Add currency":"মুদ্রা যোগ করুন","Accounts & cards":"অ্যাকাউন্ট ও কার্ড","Everywhere money goes in and out. Pick one on every entry.":"যেখান দিয়ে টাকা আসে-যায়। প্রতিটি এন্ট্রিতে একটি বেছে নিন।","Credit:":"ক্রেডিট:","pay the bill with":"বিল পরিশোধ করুন","Outflow → Credit Card Payment":"ব্যয় → ক্রেডিট কার্ড পেমেন্ট","; unpaid balances count in Debt to pay.":"দিয়ে; অপরিশোধিত ব্যালান্স পরিশোধযোগ্য দেনায় গোনা হয়।","Debit:":"ডেবিট:","spending comes out of its linked bank account.":"খরচ এর সংযুক্ত ব্যাংক অ্যাকাউন্ট থেকে যায়।","Prepaid:":"প্রিপেইড:","load it with":"টাকা ভরুন","Outflow → Card Top-up":"ব্যয় → কার্ড টপ-আপ","; spending lowers its balance.":"দিয়ে; খরচে এর ব্যালান্স কমে।","balance":"ব্যালান্স","started with {#} on {#}-{#}-{#}":"{#} দিয়ে শুরু, {#}-{#}-{#} তারিখে","Credit":"ক্রেডিট","Debit":"ডেবিট","Prepaid":"প্রিপেইড","+ Add an account or card":"+ অ্যাকাউন্ট বা কার্ড যোগ করুন","Keep your ledger in your own Google Drive so it's the same on your phone and laptop. The page only sees the files it creates. First add a Google client ID:":"আপনার হিসাব নিজের Google Drive-এ রাখুন যাতে ফোন ও ল্যাপটপে একই থাকে। পেজটি শুধু নিজের তৈরি ফাইল দেখে। প্রথমে একটি Google client ID যোগ করুন:","Save client ID":"Client ID সংরক্ষণ করুন","How to get a Google client ID (one time, about {#} minutes, free)":"Google client ID কীভাবে পাবেন (একবার, প্রায় {#} মিনিট, বিনামূল্যে)","and create a project named \"Tallywise\".":"এবং \"Tallywise\" নামে একটি প্রজেক্ট তৈরি করুন।","Go to APIs & Services → Library, search \"Google Drive API\" and click Enable.":"APIs & Services → Library-তে যান, \"Google Drive API\" খুঁজে Enable-এ ক্লিক করুন।","Go to APIs & Services → OAuth consent screen. Choose External, fill in the app name and your email, add the scope":"APIs & Services → OAuth consent screen-এ যান। External বেছে নিন, অ্যাপের নাম ও আপনার ইমেইল দিন, স্কোপ যোগ করুন",", and add your Gmail as a test user.":", এবং আপনার Gmail টেস্ট ইউজার হিসেবে যোগ করুন।","Go to APIs & Services → Credentials → Create credentials → OAuth client ID. Type: Web application. Under Authorized JavaScript origins add":"APIs & Services → Credentials → Create credentials → OAuth client ID-তে যান। ধরন: Web application। Authorized JavaScript origins-এ যোগ করুন","Copy the client ID and paste it above.":"Client ID কপি করে উপরে পেস্ট করুন।","Backup":"ব্যাকআপ","Save a copy of everything as a file, or restore from one. Use it before switching phones, or to move your data between the claude.ai page and the standalone website.":"সবকিছুর একটি কপি ফাইল হিসেবে রাখুন, বা ফাইল থেকে ফিরিয়ে আনুন। ফোন বদলানোর আগে, বা claude.ai পেজ ও আলাদা ওয়েবসাইটের মধ্যে ডেটা সরাতে এটি ব্যবহার করুন।","Download backup":"ব্যাকআপ ডাউনলোড করুন","Restore from backup":"ব্যাকআপ থেকে ফিরিয়ে আনুন","Sounds":"শব্দ","Play sounds when I save an entry or reach a goal":"এন্ট্রি সংরক্ষণ বা লক্ষ্য পূরণে শব্দ বাজান","Example entries":"উদাহরণ এন্ট্রি","Fill Tallywise with sample entries that use every feature: two currencies, goals, a credit card with a foreign purchase, loans with installments and interest, investments and repeating bills. Each one is marked “example”, and one tap removes them all without touching your own entries.":"Tallywise-কে সব ফিচার ব্যবহার করা নমুনা এন্ট্রিতে ভরুন: দুটি মুদ্রা, লক্ষ্য th":"भुगतान देय तारीख़ (महीने का दिन)","Current balance owed":"मौजूदा बकाया","From your latest statement or banking app":"आपके नवीनतम स्टेटमेंट या बैंकिंग ऐप से","Balance as of":"शेष इस तारीख़ तक","Card entries from this date on are added to it":"इस तारीख़ से कार्ड की प्रविष्टियाँ इसमें जुड़ती हैं","Current payment plan":"मौजूदा भुगतान योजना","No plan set":"कोई योजना नहीं","Pay in full every month":"हर महीने पूरा चुकाएँ","Installment plan":"किस्त योजना","Minimum payment":"न्यूनतम भुगतान","Monthly payment":"मासिक भुगतान","Months left":"बचे महीने","Minimum payment %":"न्यूनतम भुगतान %","Minimum payment at least":"न्यूनतम भुगतान कम से कम","Interest / profit rate per year %":"ब्याज / लाभ दर प्रति वर्ष %","Used to estimate the payoff date":"चुकता होने की तारीख़ का अनुमान लगाने के लिए","Remind me every month on the due day to record the card payment":"हर महीने देय दिन पर कार्ड भुगतान दर्ज करने की याद दिलाएँ","e.g. Main bank, Visa Platinum":"जैसे मुख्य बैंक, Visa Platinum","{#} if none":"कोई न हो तो {#}","{#} overdue":"{#} बकाया","{#} due within a week":"{#} एक हफ़्ते में देय","{#} at target price":"{#} लक्ष्य कीमत पर","Installment to collect":"वसूलने योग्य किस्त","recurring":"आवर्ती","Record it":"दर्ज करें","Loan to collect":"वसूलने योग्य ऋण","hit your buy target":"आपका ख़रीद लक्ष्य पूरा हुआ","Now {#} · buy target {#}":"अभी {#} · ख़रीद लक्ष्य {#}","buy target {#}":"ख़रीद लक्ष्य {#}","hit your sell target":"आपका बिक्री लक्ष्य पूरा हुआ","Now {#} · sell target {#}":"अभी {#} · बिक्री लक्ष्य {#}","sell target {#}":"बिक्री लक्ष्य {#}","Flags start {#} days before a due date and stay until it's paid or recorded.":"सूचनाएँ देय तारीख़ से {#} दिन पहले शुरू होती हैं और भुगतान या दर्ज होने तक रहती हैं।","Hide heads up":"ध्यान दें छिपाएँ","Close add menu":"जोड़ने का मेनू बंद करें","New entry":"नई प्रविष्टि","is money coming in to you.":"आपके पास आने वाला पैसा है।","is money going out from you.":"आपसे जाने वाला पैसा है।","Your regular pay. Enter gross pay and deductions, and the net is worked out for you. It also sizes your Emergency Fund.":"आपका नियमित वेतन। सकल वेतन और कटौतियाँ डालें, शुद्ध राशि अपने-आप निकलती है। यह आपकी आपातकालीन निधि का आकार भी तय करता है।","Extra pay on top of salary, like housing or food allowance, or overtime.":"वेतन के ऊपर अतिरिक्त भुगतान, जैसे आवास या भोजन भत्ता, या ओवरटाइम।","Earnings paid by stocks or funds you own. Enter the gross and any tax withheld.":"आपके शेयरों या फ़ंड से मिली कमाई। सकल राशि और कटा हुआ टैक्स डालें।","Someone paying you back for money you lent them. Pick the loan, and its balance goes down.":"कोई व्यक्ति आपका उधार दिया पैसा लौटा रहा है। ऋण चुनें, और उसका शेष घट जाएगा।","Money earned from a business or side job.":"व्यवसाय या साइड जॉब से कमाया पैसा।","Money you borrowed from someone. It shows under Debt to pay until you repay it.":"किसी से उधार लिया पैसा। चुकाने तक यह चुकाने योग्य कर्ज़ में दिखता है।","Money returned to you, like a store refund or an expense your company reimbursed.":"आपको लौटाया गया पैसा, जैसे दुकान का रिफ़ंड या कंपनी द्वारा लौटाया खर्च।","Money you take out of your free savings or a goal. That balance goes down.":"अपनी मुक्त बचत या किसी लक्ष्य से निकाला पैसा। वह शेष घट जाता है।","Selling stocks, funds, crypto, gold or forex. Pick the asset type, then enter the units, price and fees.":"शेयर, फ़ंड, क्रिप्टो, सोना या फ़ॉरेक्स बेचना। संपत्ति का प्रकार चुनें, फिर इकाइयाँ, कीमत और शुल्क डालें।","Any other income, like a gift or prize. Say what it is.":"कोई अन्य आय, जैसे उपहार या इनाम। बताएँ यह क्या है।","Pay period from":"वेतन अवधि से","Pay period to":"वेतन अवधि तक","Gross pay":"सकल वेतन","Deductions":"कटौतियाँ","Taxes, social security, loans deducted from pay":"वेतन से कटे टैक्स, सामाजिक सुरक्षा, ऋण","Time":"समय","Account":"खाता","Receipt / photo":"रसीद / फ़ोटो","Connect Google Drive to keep photos":"फ़ोटो रखने के लिए Google Drive जोड़ें","Repeat":"दोहराएँ","Doesn't repeat":"दोहराता नहीं","Every week":"हर हफ़्ते","Every {#} months":"हर {#} महीने","Every year":"हर साल","For subscriptions, rent, bills, salary and other regular entries":"सदस्यताओं, किराए, बिलों, वेतन और अन्य नियमित प्रविष्टियों के लिए","When it's due":"जब देय हो","Remind me to check and record it":"जाँचने और दर्ज करने की याद दिलाएँ","Record it automatically":"अपने-आप दर्ज करें","Pick \"remind me\" if the amount changes each time":"अगर राशि हर बार बदलती है तो \"याद दिलाएँ\" चुनें","Amount":"राशि","Net pay = gross − deductions":"शुद्ध वेतन = सकल − कटौतियाँ","Save entry":"प्रविष्टि सहेजें","Inflow or outflow":"आय या व्यय","What do these types mean?":"इन प्रकारों का क्या मतलब है?","Kind":"किस्म","Allowance":"भत्ता","Overtime":"ओवरटाइम","Paid by":"भुगतानकर्ता","Paid by (company or broker)":"भुगतानकर्ता (कंपनी या ब्रोकर)","Stock / ticker":"शेयर / टिकर","Gross dividend":"सकल लाभांश","Tax withheld":"कटा हुआ टैक्स","e.g. AAPL":"जैसे AAPL","Loan being repaid":"चुकाया जा रहा ऋण","Choose the loan":"ऋण चुनें","Amount received":"प्राप्त राशि","Business / customer":"व्यवसाय / ग्राहक","Business name":"व्यवसाय का नाम","Amount borrowed":"उधार ली गई राशि","Due date":"देय तारीख़","Interest %":"ब्याज %","Flat interest on the whole loan, if any":"पूरे ऋण पर तय ब्याज, यदि कोई हो","Refunded by":"रिफ़ंड देने वाला","What it was for":"यह किसलिए था","Taken from":"कहाँ से निकाला","Free savings (not for a goal)":"मुक्त बचत (किसी लक्ष्य के लिए नहीं)","Amount withdrawn":"निकाली गई राशि","Asset type":"संपत्ति का प्रकार","Symbol / ticker":"प्रतीक / टिकर","Broker":"ब्रोकर","Shares / units sold":"बेचे गए शेयर / इकाइयाँ","Price per share / unit":"प्रति शेयर / इकाई कीमत","Broker fees":"ब्रोकर शुल्क","e.g. AAPL, BTC, XAU, EUR/USD":"जैसे AAPL, BTC, XAU, EUR/USD","Specify the income":"आय बताएँ","e.g. Raffle prize, gift":"जैसे लॉटरी इनाम, उपहार","Add an amount above zero, the source, what the income is.":"शून्य से अधिक राशि, स्रोत, और आय क्या है, यह जोड़ें।","Everyday spending like food, groceries, rent, transport or shopping. Scan a receipt or type the items.":"रोज़ का खर्च जैसे खाना, किराना, किराया, परिवहन या ख़रीदारी। र /* ---------- entry types ---------- */

let ALL_CUR=COMMON_CUR;
try{ if(Intl.supportedValuesOf){ const s=Intl.supportedValuesOf("currency"); ALL_CUR=[...COMMON_CUR,...s.filter(c=>!COMMON_CUR.includes(c))]; } }catch(e){}

const BASE=()=>state.settings.baseCurrency||"USD";

const fmt=(v,c=BASE())=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c,currencyDisplay:c===BASE()?"narrowSymbol":"code",minimumFractionDigits:2,maximumFractionDigits:2}).format(v)}catch(e){return c+" "+v.toFixed(2)}};

const dispCur=()=>{if(view()!=="dashboard") return BASE(); const c=state.settings.displayCurrency||BASE(); return c===BASE()||rateOf(c)>0?c:BASE();};
const dispFactor=()=>{const c=dispCur(); return c===BASE()?1:rateOf(c);};

/* ---------- state ---------- */

  const M={PH:"PHP",SA:"SAR",AE:"AED",QA:"QAR",KW:"KWD",BH:"BHD",OM:"OMR",US:"USD",GB:"GBP",IN:"INR",PK:"PKR",BD:"BDT",NP:"NPR",LK:"LKR",JP:"JPY",CN:"CNY",KR:"KRW",SG:"SGD",MY:"MYR",TH:"THB",ID:"IDR",HK:"HKD",AU:"AUD",NZ:"NZD",CA:"CAD",CH:"CHF",ZA:"ZAR",NG:"NGN",KE:"KES",EG:"EGP",TR:"TRY",BR:"BRL",MX:"MXN",DE:"EUR",FR:"EUR",ES:"EUR",IT:"EUR",NL:"EUR",IE:"EUR",PT:"EUR",BE:"EUR",AT:"EUR",FI:"EUR",GR:"EUR"};

}

}}}

  try{const s=localStorage.getItem(LS_KEY); if(s){const p=JSON.parse(s); if(p&&Array.isArray(p.entries)) state=normalize(p);}}catch(e){}

function goalsWithProgress(){

function monthChart(cur){

    rows.push({date,dir:l.dir,name:l.e.party,what:l.dir==="collect"?(nx?"Installment to collect":"Loan to collect"):(nx?"Loan installment":"Loan to repay"),amt:fmt(nx?nx.amount:l.balance,l.dueCur)}); }

function accountBalances(){

function holdings(){ const H={};
  for(const e of state.entries){
    if(e.type!=="stocks"&&e.type!=="invSale") continue; const k=tkKey(e.d?.ticker); if(!k) continue;
    const h=H[k+"|"+e.currency]||(H[k+"|"+e.currency]={ticker:k,currency:e.currency,bought:0,cost:0,sold:0,proceeds:0,assetType:""});
    if(e.d?.assetType) h.assetType=e.d.assetType;

function applyPrices(d){

    if(r.error){ w.err=String(r.error).slice(0,120); continue; }
    if(r.currency&&String(r.currency).toUpperCase()!==w.currency&&!(w.type==="crypto"&&/^USD[TC]?$/.test(String(r.currency).toUpperCase())&&w.currency==="USD")){ w.err=`price came in ${r.currency}, not ${w.currency}`; continue; }
    if(!(n(r.price)>0)){ w.err="no price found"; continue; }
    w.err=null; w.price=n(r.price); w.prevClose=r.prevClose==null?null:n(r.prevClose);
    w.changePct=r.changePct!=null&&r.changePct!==""?n(r.changePct):(n(r.prevClose)>0?(w.price-n(r.prevClose))/n(r.prevClose)*100:null);

    if(r.currency&&String(r.currency).toUpperCase()!==h.currency&&!(/^USD[TC]?$/.test(String(r.currency).toUpperCase())&&h.currency==="USD")){ q.err=`price came in ${r.currency}, not ${h.currency}`; continue; }
    if(!(n(r.price)>0)){ q.err="no price found"; continue; }
    Object.assign(q,{err:null,price:n(r.price),changePct:r.changePct!=null&&r.changePct!==""?n(r.changePct):(n(r.prevClose)>0?(n(r.price)-n(r.prevClose))/n(r.prevClose)*100:null),source:String(r.source||"").slice(0,60),priceAt:d.fetchedAt||new Date().toISOString(),manual:false}); }
  state.settings.watchFetchedAt=d.fetchedAt||new Date().toISOString(); watchBusy=false; commit();
  const fresh=state.watchlist.filter(w=>wHit(w)&&!before.has(w.id));
  if(fresh.length){ playSound("in"); toast("🎯 "+fresh.map(w=>w.symbol).join(", ")+" reached your target price"); }

}

  const t0=Date.now();

const PERF_TYPES={stock:"Stocks & funds",crypto:"Crypto",commodity:"Gold & commodities",forex:"Forex",other:"Other"};
function investPerf(){
  const hs=holdings(); if(!hs.length) return null;
  const byCur={}, unpriced=[];
  for(const h of hs){
    const w=state.watchlist.find(x=>tkKey(x.symbol)===h.ticker), type=h.assetType||(w&&w.type)||"stock";
    const C=byCur[h.currency]||(byCur[h.currency]={rows:{},cost:0,value:0,unreal:0,realized:0,priced:0});
    const R=C.rows[type]||(C.rows[type]={cost:0,value:0,unreal:0,realized:0,count:0});
    R.realized+=h.realized; C.realized+=h.realized;
    if(h.held>0){ const px=n(quoteFor(h.ticker,h.currency)?.price);
      if(!px){ unpriced.push(h.ticker); continue; }
      const cost=h.held*h.avg, val=h.held*px; R.cost+=cost; R.value+=val; R.unreal+=val-cost; R.count++; C.cost+=cost; C.value+=val; C.unreal+=val-cost; C.priced++; }
  }
  return {byCur,unpriced:[...new Set(unpriced)]};
}

function applyReceiptSelection(){

const receiptPrompt=()=>`The image is a photo of a purchase receipt or tax invoice. It can be from any country and in any language. Read it carefully and extract EVERY purchased line item; do not skip any. Give item names in short English (translate if needed).

async function claudeReceipt(img,prompt){
  let mod; try{ mod=await import(ANTHROPIC_SDK); }catch(e){ throw {code:"network"}; }
  const Anthropic=mod.default||mod.Anthropic;
  const client=new Anthropic({apiKey:meta.anthropicKey,dangerouslyAllowBrowser:true});
  let msg;
  try{
    msg=await client.beta.messages.create({
      model:"claude-opus-5-5", max_tokens:16000,
      betas:["server-side-fallback-2026-07-01"], fallbacks:"default",
      output_config:{effort:"medium",format:{type:"json_schema",schema:RECEIPT_SCHEMA}},
      messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToB64(img)}},{type:"text",text:prompt+"\nFor fields that are not printed use an empty string or 0."}]}]
    });
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError||e instanceof Anthropic.PermissionDeniedError) throw {code:"bad_key"};
    if(e instanceof Anthropic.RateLimitError) throw {code:"rate_limited"};
    if(e instanceof Anthropic.BadRequestError&&/credit|billing/i.test(String(e.message))) throw {code:"no_credit"};
    if(e instanceof Anthropic.APIConnectionError) throw {code:"network"};
    throw {code:"upstream_error"};
  }
  if(msg.stop_reason==="refusal") throw {code:"refused"};
  const t=(msg.content.find(b=>b.type==="text")||{}).text;
  try{ return JSON.parse(t); }catch(e){ throw {code:"invalid_json"}; }
}

async function sdConnect(){
  if(!gClientId()){ sync.status="error"; sync.msg="Add your Google client ID first (see the steps below)."; render(); return; }
  sync.status="loading"; sync.msg=""; renderSync();
  try{
    const q=encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
    const list=await (await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime)&pageSize=5`)).json();
    meta.driveLinked=true;
    try{ const ab=await (await gFetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)")).json(); meta.driveEmail=ab?.user?.emailAddress||""; const pe=state.settings.profile?.email; if(pe&&meta.driveEmail&&pe.toLowerCase()!==meta.driveEmail.toLowerCase()) toast(`Google Drive is connected as ${meta.driveEmail}, not ${pe}`); }catch(e){}
    const f=(list.files||[])[0];
    if(f){
      meta.fileId=f.id;
      const remote=await (await gFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json().catch(()=>null);
      const pick=pickRemote(remote&&Array.isArray(remote.entries)?remote:null);
      if(pick==="conflict"){ sync.conflict=remote; saveMeta(); sync.status="conflict"; render(); return; }
      if(pick==="remote"){ state=normalize(remote); try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){} toast("Loaded your data from Google Drive"); runAutoRecurring(); }
      else if(pick==="local") sync.dirty=true;
      meta.lastSync=Date.now(); saveMeta(); sync.status="ok"; render(); if(sync.dirty) sdSave();
    } else { meta.fileId=null; saveMeta(); render(); await sdSave(true); }
  }catch(e){ sync.status="error"; sync.msg=gErr(e); render(); }
}
async function sdSave(){
  if(sync.conflict||!meta.driveLinked||!gClientId()) return;
  if(sync.saving){ sync.dirty=true; return; }
  sync.saving=true; sync.dirty=false; sync.status="saving"; renderSync();
  const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  try{
    let ok=false;
    if(meta.fileId){ try{ await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${meta.fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:blob}); ok=true; }catch(e){ if(e.code!=="http"||e.status!==404) throw e; } }
    if(!ok){ const mp=multipart({name:DRIVE_FILE,mimeType:"application/json"},blob); const r=await (await gFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":mp.type},body:mp.body})).json(); meta.fileId=r.id; }

function changeBase(nb){
  const ob=BASE(); if(nb===ob) return;
  const R=state.settings.rates; const hasData=state.entries.length||state.recurring.length||n(state.settings.monthlySalaryOverride);
  let f=n(R[nb]?.rate);
  if(!(f>0)&&webRates?.rates?.[nb]) f=n(webRates.rates[nb]);
  if(hasData&&!(f>0)){ toast(`Add a rate for ${nb} first (in ${ob}), then switch.`); if(!R[nb]) {R[nb]={rate:0,date:null,source:"Manual"}; commit();} return; }
  if(f>0){
    for(const e of state.entries){ e.php=r2(e.php/f); e.rate=e.currency===nb?1:Math.round(n(e.rate)/f*1e6)/1e6; }
    state.settings.monthlySalaryOverride=r2(n(state.settings.monthlySalaryOverride)/f);
    const nr={}; for(const [c,v] of Object.entries(R)) if(c!==nb) nr[c]={...v,rate:Math.round(n(v.rate)/f*1e6)/1e6};
    nr[ob]={rate:Math.round(1/f*1e6)/1e6,date:today(),source:R[nb]?.source||"Web"};
    state.settings.rates=nr;
  } else { const nr={}; for(const c of Object.keys(R)) if(c!==nb) nr[c]={rate:0,date:null,source:"Web"}; state.settings.rates=nr; }
  state.settings.baseCurrency=nb; state.settings.baseConfirmed=true;
  if(state.settings.displayCurrency===nb||state.settings.displayCurrency===ob) state.settings.displayCurrency=nb;
  webRates=null; commit(); toast("Main currency is now "+nb); loadWebRates();
}

async function wzApply(upto){
  const S=state.settings, d=wz.d, D=today(), T=nowTime(), has=v=>String(v??"").trim()!=="";
  const inc=id=>WZ.findIndex(s=>s[0]===id)<upto&&!wz.skip.has(id);
  const rate=c=>{ if(c===BASE()) return 1; let r=rateOf(c); if(!(r>0)){ const w=n(webRates?.rates?.[c]); if(w>0){ S.rates[c]={rate:w,date:String(webRates.asOf||D),source:"Web: "+(webRates.source||"market rate")}; r=w; } else if(!S.rates[c]) S.rates[c]={rate:0,date:null,source:"Manual"}; } return r||0; };
  const open=(kind,type,amount,cur,party,dd)=>{ const r=rate(cur); state.entries.push({id:uid(),kind,type,amount:r2(n(amount)),currency:cur,rate:r,php:r2(n(amount)*r),date:D,time:T,account:"",party,notes:"Starting balance",d:dd,receipt:null,receiptFileId:null,opening:true}); };
  S.openingBalances=S.openingBalances||{}; S.accountKinds=S.accountKinds||{};
  if(inc("profile")){ const p=d.profile; S.profile={...(S.profile||{}),name:p.name.trim(),birthday:p.birthday||"",email:p.email.trim()}; S.baseConfirmed=true;
    if(has(p.pin)){ S.profile.pinHash=await pinHash(String(p.pin).trim()); setUnlocked(S.profile.pinHash); } }
  if(inc("money")){ const keep=new Set();
    for(const r of d.money){ const nm=r.name.trim(); if(!nm) continue; keep.add(nm);
      if(!S.accounts.includes(nm)&&!S.cards.some(c=>c.name===nm)) S.accounts.push(nm);
      S.accountKinds[nm]=r.kind;
      if(has(r.amount)){ rate(r.currency); S.openingBalances[nm]={amount:r2(n(r.amount)),currency:r.currency,date:D}; } else delete S.openingBalances[nm]; }
    S.accounts=S.accounts.filter(a=>keep.has(a)||state.entries.some(e=>e.account===a)||state.recurring.some(x=>x.tpl.account===a)); }
  if(inc("cards")) for(const c of d.cards){ const nm=c.name.trim(); if(!nm) continue; rate(c.currency);
    const card={name:nm,currency:c.currency,limit:n(c.limit),dueDay:n(c.dueDay)||null,openingBalance:r2(n(c.balance)),openingDate:D,plan:c.plan?{type:c.plan,monthly:n(c.monthly),monthsLeft:0,minPct:0,minAmount:0,apr:0}:null};
    const ex=S.cards.find(x=>x.name===nm); if(ex) Object.assign(ex,card); else if(!S.accounts.includes(nm)) S.cards.push(card); }
  if(inc("people")){
    for(const r of d.owedToMe) if(has(r.name)&&n(r.amount)>0) open("out","lend",r.amount,r.currency,r.name.trim(),{dueDate:r.due||"",interest:0});
    for(const r of d.iOwe) if(has(r.name)&&n(r.amount)>0) open("in","loanIn",r.amount,r.currency,r.name.trim(),{dueDate:r.due||"",interest:0}); }
  if(inc("income")){ const s=d.salary;
    if(n(s.amount)>0){ rate(s.currency); S.expectedSalary={amount:r2(n(s.amount)),currency:s.currency,payday:n(s.payday)||null,employer:s.employer.trim()};
      if(s.remind&&!state.recurring.some(x=>x.tpl.type==="salary")) state.recurring.push({id:uid(),freq:"monthly",auto:false,paused:false,next:nextDue(s.payday)||D,tpl:{kind:"in",type:"salary",amount:r2(n(s.amount)),currency:s.currency,account:mainAcct(),party:s.employer.trim()||"Employer",notes:"",time:"09:00",d:{gross:r2(n(s.amount)),deductions:0}}}); }
    for(const b of d.bills) if(has(b.name)&&n(b.amount)>0){ rate(b.currency); state.recurring.push({id:uid(),freq:b.freq||"monthly",auto:false,paused:false,next:nextDue(b.day)||D,tpl:{kind:"out",type:"bills",amount:r2(n(b.amount)),currency:b.currency,account:mainAcct(),party:b.name.trim(),notes:"",time:"09:00",d:{mode:"manual"}}}); } }
  if(inc("savings")){
    for(const g of d.goals) if(has(g.name)&&n(g.target)>0){ const id=uid(); S.goals.push({id,name:g.name.trim(),target:n(g.target),currency:g.currency||defCur(),deadline:g.date||null}); if(n(g.saved)>0) open("out","savings",g.saved,g.currency||defCur(),g.name.trim(),{goalId:id}); }
    for(const v of d.invest) if(has(v.name)&&n(v.amount)>0){ const sh=n(v.shares); open("out","stocks",v.amount,v.currency,"Already held",{ticker:v.name.trim(),shares:sh||"",price:sh?r2(n(v.amount)/sh):"",fees:0}); } }
  S.onboarded=true; commit();
}

/* ---------- PIN lock ---------- */
const UNLOCK_KEY="tallywise-unlocked";
let unlockedHash=null; try{unlockedHash=sessionStorage.getItem(UNLOCK_KEY)}catch(e){}
function setUnlocked(h){ unlockedHash=h; try{sessionStorage.setItem(UNLOCK_KEY,h)}catch(e){} }
async function pinHash(pin){ const s="tallywise:"+pin;
  try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return "f"+h.toString(16); } }
const isLocked=()=>!!state.settings.profile?.pinHash&&unlockedHash!==state.settings.profile.pinHash;
function renderLock(){
  let el=$("#lock"); if(!el){ el=document.createElement("div"); el.id="lock"; document.body.appendChild(el); }
  const P=state.settings.profile, fg=!!ui.forgot;

   <div class="body">${fg?`<p class="muted" style="margin:0">Enter the ${[P.email&&"email",P.birthday&&"birthday"].filter(Boolean).join(" and ")} from your profile to remove the PIN.</p>${P.email?`<div class="f"><label for="fgEmail">Email</label><input id="fgEmail" type="email" autocomplete="email"></div>`:""}${P.birthday?`<div class="f"><label for="fgBday">Birthday</label><input id="fgBday" type="date"></div>`:""}`
   :`<div class="f"><label for="pinIn">Enter your PIN</label><input id="pinIn" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>`}
   <p class="small" id="lockErr" role="alert" style="color:var(--bad);margin:0"></p></div>
   <footer>${P.email||P.birthday?`<button class="btn ghost" type="button" id="lockAlt">${fg?"Back to PIN":"Forgot PIN?"}</button>`:""}<button class="btn primary" type="submit">${fg?"Remove PIN":"Unlock"}</button></footer></form></div>`;
  const alt=$("#lockAlt"); if(alt) alt.onclick=()=>{ ui.forgot=!ui.forgot; renderLock(); };
  $("#lockForm").onsubmit=async ev=>{ ev.preventDefault();
    if(fg){ const okE=!P.email||($("#fgEmail").value.trim().toLowerCase()===P.email.toLowerCase()), okB=!P.birthday||$("#fgBday").value===P.birthday;
      if(okE&&okB){ delete P.pinHash; ui.forgot=false; el.remove(); commit(); toast("PIN removed. You can set a new one in Rates & accounts."); }
      else $("#lockErr").textContent="That doesn't match your profile."; return; }
    const h=await pinHash($("#pinIn").value.trim());
    if(h===P.pinHash){ setUnlocked(h); el.remove(); render(); } else { $("#lockErr").textContent="Wrong PIN. Try again."; $("#pinIn").value=""; $("#pinIn").focus(); } };
  setTimeout(()=>($("#pinIn")||$("#fgEmail")||$("#fgBday"))?.focus(),30);

/* ---------- sound effects (made in the browser, no files) ---------- */
let audioCtx=null;
function playSound(kind){
  if(state.settings.soundOff) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const ac=audioCtx; if(ac.state==="suspended") ac.resume();
    const t0=ac.currentTime, out=ac.createGain(); out.gain.value=0.22; out.connect(ac.destination);
    const tone=(f,start,dur,type="sine",vol=1,slideTo=null)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0+start); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+start+dur);
      g.gain.setValueAtTime(0.0001,t0+start); g.gain.exponentialRampToValueAtTime(vol,t0+start+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+start+dur); o.connect(g); g.connect(out); o.start(t0+start); o.stop(t0+start+dur+0.02); };
    if(kind==="in"){ tone(1318.5,0,.18,"triangle",.9); tone(1975.5,.07,.45,"triangle",.8); tone(2637,.07,.35,"sine",.25); }   // coin "cha-ching"
    else if(kind==="out"){ tone(660,0,.22,"sine",.8,330); tone(990,0,.12,"triangle",.25,495); }                                 // soft downward "whoop"
    else if(kind==="goal"){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.11,.32,"triangle",.8)); [1046.5,1318.5,1568].forEach(f=>tone(f,.48,.9,"sine",.35)); } // rising fanfare + bright chord
    else tone(880,0,.09,"sine",.5);                                                                                                 // edit: short tick
  }catch(e){}
}

function celebrate(){
  playSound("goal");
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.className="confetti"; cv.setAttribute("aria-hidden","true"); document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cols=["#2a78d6","#eb6834","#8a4fd0","#12a08a","#e0457b","#e3a008","#2d7a34"];
  const ps=Array.from({length:160},(_,i)=>{ const left=i%2===0; return {x:left?-10:W+10,y:H*0.65,vx:(left?1:-1)*(4+Math.random()*7),vy:-(9+Math.random()*9),w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]}; });
  const t0=performance.now();
  (function frame(t){ const el=t-t0; ctx.clearRect(0,0,W,H);
    for(const p of ps){ p.vy+=0.32; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-el/3200); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+2); ctx.restore(); }
    if(el<3200) requestAnimationFrame(frame); else cv.remove(); })(t0);
}

function trCore(k){
  if(DICT[k]!=null) return DICT[k];
  const w=k.match(/^([·\s]+)?(.*?)([·\s:]+)?$/); if(w&&(w[1]||w[3])&&w[2]){ const r=trCore(w[2]); return r==null?null:(w[1]||"")+r+(w[3]||""); }

  const mm=k.match(/^([A-Za-z]+) (\d{4})$/); if(mm&&MONTHS[mm[1]]) return MONTHS[mm[1]]+" "+mm[2];
  if(MONTHS[k]) return MONTHS[k];

const noTr=el=>!el||el.closest("script,style,textarea,[translate=no]");

}
function trText(t){ if(noTr(t.parentElement)) return; let o=trOrig.get(t); if(o==null||(t.data!==o.en&&t.data!==o.tr)){ o={en:t.data,tr:null}; trOrig.set(t,o); } const v=LANG==="en"?o.en:(trStr(o.en)??o.en); o.tr=v; if(t.data!==v) t.data=v; }
function trAttr(el,a){ let m=trAttrOrig.get(el); if(!m){ m={}; trAttrOrig.set(el,m); } const cur=el.getAttribute(a); let o=m[a]; if(!o||(cur!==o.en&&cur!==o.tr)){ o=m[a]={en:cur,tr:null}; } const v=LANG==="en"?o.en:(trStr(o.en)??o.en); o.tr=v; if(cur!==v) el.setAttribute(a,v); }
function setupLang(){
  LANG=pickLang(); DICT=I18N[LANG]||{}; MONTHS={};
  try{ curNames=LANG==="en"?null:new Intl.DisplayNames([LANG],{type:"currency"}); }catch(e){ curNames=null; }
  if(LANG!=="en") for(let i=0;i<12;i++){ const d=new Date(2026,i,15);
    for(const loc of ["en-US","en-GB"]) for(const st of ["short","long"]) MONTHS[d.toLocaleString(loc,{month:st})]=d.toLocaleString(LANG,{month:st}); }
  document.documentElement.lang=LANG; document.documentElement.dir=RTL_LANGS.has(LANG)?"rtl":"ltr";
}
function retranslateAll(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); let t; while(t=w.nextNode()) if(trOrig.has(t)||LANG!=="en") trText(t);
  document.querySelectorAll("[placeholder],[aria-label],[title],optgroup[label]").forEach(el=>{ if(!noTr(el)) for(const a of TR_ATTRS) if(el.hasAttribute(a)) trAttr(el,a); });
}
function setLang(v){ if(!langOk(v)) return; state.settings.lang=v; meta.lang=v; saveMeta(); commit(); setupLang(); retranslateAll(); if(wz){ wzRead(); renderWizard(); } }
new MutationObserver(recs=>{ if(LANG==="en") return; for(const r of recs){ if(r.type==="childList") r.addedNodes.forEach(trNode); else if(r.type==="attributes"&&!noTr(r.target)) trAttr(r.target,r.attributeName); } })
  .observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:TR_ATTRS});
document.addEventListener("change",e=>{ if(e.target.id==="langSel"||e.target.id==="wzLang") setLang(e.target.value); });

/* ---------- dropdowns: the 3 most recently picked options come first ---------- */
const REC_MIN=6;
const selKey=s=>s.id||((s.dataset.g?s.dataset.g+".":"")+(s.dataset.f||s.name||""));
function recEnhance(s){
  if(!s||s.multiple||!s.isConnected) return;
  const key=selKey(s); if(!key) return;
  const old=s.querySelector(":scope>optgroup[data-rec]");
  const base=[...s.options].filter(o=>!o.closest("optgroup[data-rec]")&&o.value!==""&&!o.disabled);
  const rec=base.length<REC_MIN?[]:(meta.recentSel?.[key]||[]).map(v=>base.find(o=>o.value===v)).filter(Boolean).slice(0,3);
  const sig=rec.map(o=>o.value).join("\u0001");
  if((old?.dataset.sig||"")===sig) return;
  const cur=s.value;
  old?.remove();
  if(rec.length){
    if([...s.children].some(c=>c.tagName==="OPTION"&&c.value!==""&&!c.disabled)){
      const all=document.createElement("optgroup"); all.label="All options";
      [...s.children].filter(c=>c.tagName==="OPTION"&&c.value!==""&&!c.disabled).forEach(o=>all.appendChild(o));
      s.appendChild(all);
    }
    const g=document.createElement("optgroup"); g.dataset.rec="1"; g.dataset.sig=sig; g.label="Recently used";
    rec.forEach(o=>{ const c=o.cloneNode(true); c.removeAttribute("selected"); c.selected=false; g.appendChild(c); });
    const lead=[...s.children].find(c=>!(c.tagName==="OPTION"&&(c.value===""||c.disabled)));
    s.insertBefore(g,lead||null);
  }
  s.value=cur;
}
const recNote=ev=>{ const s=ev.target; if(s?.tagName!=="SELECT"||s.multiple||!s.value) return; const k=selKey(s); if(!k) return;
  const R=meta.recentSel||(meta.recentSel={}), L=R[k]||[]; if(L[0]===s.value) return; R[k]=[s.value,...L.filter(v=>v!==s.value)].slice(0,3); saveMeta(); };
document.addEventListener("input",recNote,true); document.addEventListener("change",recNote,true);
new MutationObserver(recs=>{ const set=new Set(); for(const r of recs){ const t=r.target; if(t.tagName==="SELECT") set.add(t); else if(t.tagName==="OPTGROUP"&&t.parentElement?.tagName==="SELECT") set.add(t.parentElement);
  r.addedNodes.forEach(n=>{ if(n.nodeType!==1) return; if(n.tagName==="SELECT") set.add(n); else if(n.querySelectorAll) n.querySelectorAll("select").forEach(x=>set.add(x)); }); } set.forEach(recEnhance); })
  .observe(document.body,{childList:true,subtree:true});

/* ---------- toast & boot ---------- */
// claude.ai's frame blocks mailto links, so the address can also be copied
async function copyDevMail(){ const a=$("#devMail").textContent.trim(); let ok=false;
  try{ await navigator.clipboard.writeText(a); ok=true; }catch(e){}
  if(!ok){ try{ const t=document.createElement("textarea"); t.value=a; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select(); ok=document.execCommand("copy"); t.remove(); }catch(e){} }
  if(ok) toast("Email copied"); else { const r=document.createRange(); r.selectNodeContents($("#devMail")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Press and hold the address to copy it"); } }
document.addEventListener("click",ev=>{ if(ev.target.closest("#devMailCopy")) copyDevMail(); });
let toastT=null;
function toast(msg){ const h=$("#toastHost"); h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>h.innerHTML="",3200); }
let webRates=null, officialRates=null;
window.__tw={setOfficial:t=>{officialRates=t; commit();}};
async function fetchStandaloneRates(){
  const b=BASE().toLowerCase();
  for(const u of RATES_URLS(b)){
    try{ const r=await fetch(u); if(!r.ok) continue; const j=await r.json(); const rates={};
      for(const [k,v] of Object.entries(j[b]||{})) if(n(v)>0) rates[k.toUpperCase()]=Math.round(1/n(v)*1e6)/1e6;
      return {asOf:String(j.date||today()),source:"market rate",rates}; }catch(e){}
  }
  return null;
}
async function loadWebRates(){
  try{
    let d;
    if(IN_CLAUDE){ const db=await window.claude.use("db"); if(!db) return; try{ const o=await db.doc("rates/official").get(); if(o.exists){ officialRates=(o.data()||{}).tables||null; } }catch(e){}
      const snap=await db.doc("rates/latest").get(); if(!snap.exists) return; d={...(snap.data()||{})};
      const pr={PHP:1,...(d.rates||{})}, rb=n(pr[BASE()]); if(!(rb>0)) return; d.rates={}; for(const [k,v] of Object.entries(pr)) if(n(v)>0) d.rates[k]=Math.round(n(v)/rb*1e6)/1e6; }
    else { d=await fetchStandaloneRates(); if(!d) return; }
    webRates={asOf:String(d.asOf||""),source:d.source||"",rates:d.rates||{}};
    let changed=false;
    for(const c of Object.keys(state.settings.rates)){
      const v=n(webRates.rates[c]); if(c===BASE()||!(v>0)) continue;
      const cur=state.settings.rates[c]||{};
      const curWeb=String(cur.source||"").startsWith("Web");
      if(!n(cur.rate)||!cur.date||webRates.asOf>cur.date||(webRates.asOf===cur.date&&curWeb&&n(cur.rate)!==v)){
        state.settings.rates[c]={rate:v,date:webRates.asOf,source:"Web: "+(webRates.source||"market rate")}; changed=true;
      }
    }
    for(const e of state.entries) if(!(n(e.rate)>0)&&rateOf(e.currency)>0){ e.rate=rateOf(e.currency); e.php=r2(e.amount*e.rate); changed=true; }
    if(draft&&draft.currency!==BASE()&&!(n(draft.rate)>0)){ const r=ensureRate(draft.currency); if(r>0){ draft.rate=r; changed=true; } }
    if(changed) commit(); else render();
    runAutoRecurring();
  }catch(e){}
}
loadLocal(); setupLang(); render(); document.querySelectorAll("select").forEach(recEnhance); retranslateAll(); runAutoRecurring(); loadWebRates();
if(!state.settings.onboarded&&!hasData(state)&&!isLocked()) openWizard();
(async()=>{
  if(!IN_CLAUDE){ if(meta.driveLinked&&gClientId()){ sync.status="paused"; sync.msg="Tap the Drive chip to sync"; } render(); return; }
  try{ mcp=await window.claude.use("mcp"); }catch(e){ mcp=null; }
  if(mcp&&meta.driveLinked) driveConnect(false); else render();
  if(wz&&WZ[wz.i][0]==="profile"){ wzRead(); renderWizard(); }
})();
})();
